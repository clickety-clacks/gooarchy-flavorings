# Gooarchy flavorings for Scottland, appended to Scottland's shipped config by
# /usr/lib/scottland/config.d/40-gooarchy-flavorings. ~/.config/scottland/overrides.ini still
# comes after and wins.

[input]
# Tap to click and tap-and-drag: Scottland's double-tap-and-drag with drag lock and its
# three-finger tap-and-drag resize both build on libinput's tap-and-drag.
tap_to_click = true
tap_and_drag = true
drag_lock = true

[command]
# The picker inserts the selected emoji into the focused application by default.
binding_emoji_picker = <super> <ctrl> KEY_E
command_emoji_picker = scottland-emoji
# Strata is the file manager.
binding_file_manager = <super> <shift> KEY_F
command_file_manager = strata
# Chromium is the browser. (Gooarchy has no launcher yet: these keys and the terminal are how
# apps start.)
binding_browser = <super> <shift> KEY_B
command_browser = chromium
# Scottland's sheet reflects shortcuts that work in this session, including imported Omarchy keys.
binding_keybinding_cheat_sheet = <super> KEY_K
command_keybinding_cheat_sheet = scottland-keybindings
# Print and Shift+Print (bound by Scottland) save into your Pictures folder wherever it is (a
# localized or moved folder, from xdg-user-dirs), not a fixed ~/Pictures.
command_screenshot = sh -c 'd=$(xdg-user-dir PICTURES); mkdir -p "$d" && grim "$d/screenshot-$(date +%F_%H-%M-%S).png"'
command_screenshot_interactive = sh -c 'd=$(xdg-user-dir PICTURES); mkdir -p "$d" && grim -g "$(slurp)" "$d/screenshot-$(date +%F_%H-%M-%S).png"'
