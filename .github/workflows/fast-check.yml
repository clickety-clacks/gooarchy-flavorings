name: fast-check

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  fast-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test Flavorings product behavior
        run: make test
      - name: Test widget packages
        run: python3 tests/widget-packages-test.py
